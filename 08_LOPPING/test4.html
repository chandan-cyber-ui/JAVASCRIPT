<body>

    <script>
        // alternate prime no
        let count=1;
        for(let num=1;num<=50;num++){
            let prime =true;
            if(prime<1){
                prime=false;
            }else{
                for(let i=2;i<=parseInt(num/2);i++){
                    if(num%i==0){
                        prime=false;
                        break;
                    }
                }
            }
            if(prime){
                if(count%2!=0)console.log(num);
                count++;
              
              
            }
            
        }
    </script>
    
</body>
