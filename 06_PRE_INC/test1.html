<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // pre increment
        let a=10;
          console.log(++a)
           console.log(++a)
           //post increment
           console.log(a++)
            console.log(a++)
             console.log(a++)


            //  predecrement
            a=5;
            console.log(--a)
            console.log(--a)

            // post decrement

            console.log(a--);
            console.log(a--);
            



    </script>
</body>
</html>
