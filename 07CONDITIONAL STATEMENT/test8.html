<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let amount = +prompt("enter your shopping amount");
        let discount = 0;
        let bill = 0;

        if (amount >= 5000) {
            discount = amount * 30 / 100;
            bill = amount - discount
            console.log(bill)
        }
        else if (amount >= 3000) {
            discount = amount * 20 / 100;
            bill = amount - discount
            console.log(bill)
        }
          else if (amount >= 1000) {
            discount = amount * 10 / 100;
            bill = amount - discount
            console.log(bill)
        }
         else if (amount < 1000) {
            discount = 0;
            bill = amount - discount
            console.log(bill)
        }
        else{
            console.log("invalid input")
        }

    </script>
</body>

</html>
